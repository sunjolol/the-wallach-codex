<!DOCTYPE html>
<html lang="en" data-theme="cream" data-accent="ember">
<head>
<meta charset="UTF-8">
<!--
═══════════════════════════════════════════════════════════════════════════════
  dashboard.html — The Wallach Codex — the app shell
═══════════════════════════════════════════════════════════════════════════════
  A pure shell: it carries no data, no logic and no inline blocks. It links the
  11 stylesheets below (load order matters) and ONE script, assets/js/dist/main.js.

  That bundle is emitted as an IIFE, not an ES module, so the page runs straight
  from file:// with no server. Every byte of data it needs is inlined at build
  time by esbuild as JSON imports from assets/data/, so nothing is fetched while
  the app is running.

  Architecture reference: see dashboard/README.md.

  CSP notes:
    - No external origin is allowed at all: script, style, font and image
      sources all resolve to 'self'. There is no CDN and no analytics.
    - All fonts are in-housed under assets/fonts/ (SIL OFL 1.1), which is what
      makes a font-src of 'self' alone sufficient.
    - The 'wasm-unsafe-eval', blob: and worker-src allowances exist for the
      vendored on-device OCR engine (assets/vendor/tesseract/), which the
      Scanner loads from disk when a scan starts.
═══════════════════════════════════════════════════════════════════════════════
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' blob: data:; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Health Journey</title>

<!-- ═══ Favicon ═══════════════════════════════════════════════════════════
     Declared rather than left to a root favicon.ico. A page that declares no icon makes
     every browser probe /favicon.ico on its own, which was the only 404 on the live site.
     Two PNGs, so the 16px tab strip is not a downscale of the 32px art. They live under
     assets/ like every other image, so img-src 'self' already covers them and no
     root-level file is needed — which matters because the web build ships the CONTENTS
     of dist-web/, and a root file would be one more thing to remember to drag. -->
<link rel="icon" type="image/png" sizes="32x32" href="./assets/favicons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./assets/favicons/favicon-16x16.png">

<!-- ═══ Stylesheets (load order matters) ═══════════════════════════════════ -->
<link rel="stylesheet" href="./assets/styles/design-system.css">
<link rel="stylesheet" href="./assets/styles/dashboard.css">
<link rel="stylesheet" href="./assets/styles/workspace-coverage.css">
<link rel="stylesheet" href="./assets/styles/workspace-regimen.css">
<link rel="stylesheet" href="./assets/styles/workspace-scanner.css">
<link rel="stylesheet" href="./assets/styles/drawer-shared.css">
<link rel="stylesheet" href="./assets/styles/drawer-knowledge.css">
<link rel="stylesheet" href="./assets/styles/drawer-orac.css">
<link rel="stylesheet" href="./assets/styles/drawer-search.css">
<!-- Futurist type direction: Unbounded (display) + Space Grotesk (body). Loads AFTER
     design-system.css, so it SUPERSEDES that file's serif font tokens app-wide — the live
     faces are named in type-futurist.css, not in the sealed token layer. -->
<link rel="stylesheet" href="./assets/styles/type-futurist.css">
<!-- Appearance layer: theme (cream/dark) + primary accent. Loads AFTER design-system.css so it
     shadows the sealed tokens under [data-theme]/[data-accent] on <html> (never edits them).
     main.ts stamps those attributes from the persisted profile. See views/profile.ts. -->
<link rel="stylesheet" href="./assets/styles/theme.css">
<!-- LAST on purpose: the phone arrangement wins on source order, not on specificity. -->
<link rel="stylesheet" href="./assets/styles/mobile.css">

</head>
<body>

<!-- ═══ APP SHELL ═════════════════════════════════════════════════════════ -->
<div class="app-shell">

  <!-- SYSTEM RAIL — the app's primary navigation -->
  <aside class="app-rail">
    <div class="rail__brand">
      <!-- The brand mark is the product's actual name. No decorative serial belongs here:
           a hex code dressed up as a real identifier asserts an identity the app does not
           have, and every such flourish was removed for exactly that reason. -->
      <div class="rail__brand-mark">Wallach Codex</div>
      <div class="rail__brand-name" id="railBrandName">Codex</div>
      <!-- DERIVED at boot from the sealed corpus, never typed: a count that is true today
           and frozen into the markup forever is a lie with a delay. No app version string
           belongs here either — the build stamps none, so any number shown would be invented. -->
      <div class="rail__brand-sub" id="railBrandSub"></div>
    </div>
    <div class="rail__section">
      <div class="rail__section-label">Workspaces</div>
      <button class="rail__item" data-rail-nav="coverage"><span class="rail__icon">◉</span><span class="rail__label">Coverage</span><span class="rail__kbd">1</span></button>
      <button class="rail__item" data-rail-nav="regimen"><span class="rail__icon">▤</span><span class="rail__label">Regimen</span><span class="rail__kbd">2</span></button>
      <button class="rail__item" data-rail-nav="scanner"><span class="rail__icon">⌖</span><span class="rail__label">Scanner</span><span class="rail__kbd">3</span></button>
    </div>
    <div class="rail__divider"></div>
    <div class="rail__section">
      <div class="rail__section-label">Drawers</div>
      <button class="rail__item" data-rail-nav="search"><span class="rail__icon">⌕</span><span class="rail__label">Search</span><span class="rail__kbd">S</span></button>
      <button class="rail__item" data-rail-nav="knowledge"><span class="rail__icon">❡</span><span class="rail__label">Knowledge</span><span class="rail__kbd">K</span></button>
    </div>
    <div class="rail__spacer"></div>
    <div class="rail__footer">
      <div class="rail__profile">
        <div class="rail__avatar" id="railAvatar">Y</div>
        <div>
          <div class="rail__profile-name" id="railProfileName">You</div>
          <div class="rail__profile-meta">SETTINGS · PROFILE</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- TOPBAR -->
  <header class="app-topbar">
    <!-- THE NAMEPLATE. The <h1> names the surface and the deck says what that surface IS.
         Nothing decorative goes here: a workspace serial would number a scheme that does
         not exist, and a scrambled-cipher flourish would only repeat the <h1> beside it. -->
    <div class="topbar__breadcrumb">
      <h1 class="np__name">Coverage</h1>
      <span class="np__rule" aria-hidden="true"></span>
      <span class="np__deck">Every essential Wallach named, measured against what you take.</span>
    </div>
    <!-- THE GOALS TOGGLE — phone only. It is `display: none` at every width by default, and
         only the phone layer turns it on, so the desktop topbar is byte-for-byte unchanged: a
         `display: none` child is not a grid item at all, so the 3-column grid below still sees
         exactly three items.
         ★ THE DEFAULT LIVES IN dashboard.css, NOT mobile.css, and that is not a style
         preference. mobile.css is deliberately held back from the web build
         (web_build_excludes_unapproved_styles), so a default stated there never reaches
         nutrientcodex.com — the website would draw this as a raw unstyled UA button. That exact
         trap has shipped three times here (the food-sheet Add button, .kd-ep--prod,
         .cov-panes__btn). A media query can only ADD. -->
    <button class="topbar__goals" data-goals-toggle type="button" aria-expanded="false">Goals</button>
    <!-- The topbar's flexible middle column. NOT stray markup: .app-topbar is a 3-column grid
         (auto | minmax(0,1fr) | auto) and this empty span IS the spacer that pushes Ask Wallach
         to the far right. Delete it and the topbar layout collapses. -->
    <span></span>
    <button class="topbar__ask topbar__ask--green" data-topbar-ask type="button" aria-label="Ask Wallach — open Search">
      <span class="topbar__ask-dot" aria-hidden="true"></span>
      <span class="topbar__ask-label">Ask Wallach</span>
      <span class="topbar__ask-kbd">S</span>
    </button>
    <!-- No sync/status or version chrome here, deliberately: the app has no network and no
         backend, so a "SYNCED" indicator would be asserting a fact it cannot know, and the
         build stamps no version for a version readout to display. -->
  </header>

  <!-- WORKSPACE — hosts the workspace mount slots -->
  <main class="app-workspace">

    <!-- WORKSPACE MOUNT SLOTS — main.ts renders one workspace at a time into these -->
    <div id="workspace-coverage-mount"></div>
    <div id="workspace-regimen-mount"></div>
    <div id="workspace-scanner-mount"></div>

  </main>

  <!-- No footer status strip, deliberately, and it must not be reintroduced: every line one
       would carry is something this app cannot truthfully report at runtime. A readiness
       readout monitors no system; a build version does not exist because the build stamps
       none; and a seal hash typed into markup is a FAKE seal on a project whose whole thesis
       is that seals are real and verifiable. Real seal hashes live in the .golden.sha256
       files and are checked by the invariant board — never displayed as decoration. -->

  <!-- OVERLAY MOUNT SLOTS — the drawers mount here, above the workspace -->
  <div id="drawer-search-mount"></div>
  <!-- Textured-highlighter filter for <mark> (design-system.css filter: url(#ds-filter-rough)); required once per page. -->
  <svg width="0" height="0" aria-hidden="true" style="position: absolute;"><defs><filter id="ds-filter-rough"><feTurbulence type="fractalNoise" baseFrequency=".08" numOctaves="4"/><feDisplacementMap in="SourceGraphic" scale="5" /></filter></defs></svg>
  <div id="drawer-knowledge-mount"></div>
  <div id="palette-mount"></div>

</div>

<!-- The arrival veil's host. EMPTY in the markup on purpose: the veil is state-driven
     (views/welcome.ts mounts it only when state/profile.ts has never been asked), so it can
     never be a wall that shows up for a user who already answered. -->
<div id="welcomeHost"></div>

<!-- IIFE format, NOT type="module": a file:// page has a null origin, so the browser refuses
     to load an ES module from disk. tools/build.mjs emits IIFE for that reason — changing the
     output format would break double-click-to-open, which is the app's whole delivery model. -->
<script src="./assets/js/dist/main.js"></script>

</body>
</html>
