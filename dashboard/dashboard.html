<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!--
═══════════════════════════════════════════════════════════════════════════════
  dashboard.html — Wallach Health Agent  (v3.27 · Round 1·B skeleton swap)
═══════════════════════════════════════════════════════════════════════════════
  This is the slim shell of the v3 dashboard. It loads:
    1. design-system.css   — the sealed visual token vocabulary
    2. dashboard.css       — app-shell layout (grid, drawer slots, palette)
    3. dist/main.js        — new ES-module entry point

  Pure shell: NO inline data blocks remain. Data is inlined into dist/main.js
  by esbuild (JSON imports) or read from assets/data/*.json. The legacy inline
  versions-data block, the 5 creators-log markdown blocks, and the unloaded
  creators-log-handler.js were removed 2026-07-05 (Phase D-review) — their
  content lives in git + chronicle/creators-log + assets/data/creators-log.

  Architecture reference: see dashboard/ARCHITECTURE.md.

  CSP notes:
    - REMOVED: the Google Fonts stylesheet CDN (was a 'style-src' allow)
    - REMOVED: the Google Fonts static-font CDN (was a 'font-src' allow)
    - Reason: all fonts now in-housed under assets/fonts/ (SIL OFL 1.1)
    - Result: 0 external resources (Tesseract.js loaded dynamically when scan starts)
═══════════════════════════════════════════════════════════════════════════════
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' blob: data:; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luneth's Health Journey — Wallach Framework Dashboard</title>

<!-- ═══ Stylesheets (load order matters) ═══════════════════════════════════ -->
<link rel="stylesheet" href="./assets/styles/design-system.css">
<link rel="stylesheet" href="./assets/styles/dashboard.css">
<link rel="stylesheet" href="./assets/styles/workspace-coverage.css">
<link rel="stylesheet" href="./assets/styles/drawer-shared.css">
<link rel="stylesheet" href="./assets/styles/drawer-journey.css">
<link rel="stylesheet" href="./assets/styles/drawer-knowledge.css">
<link rel="stylesheet" href="./assets/styles/drawer-search.css">

</head>
<body>

<!-- ═══ APP SHELL ═════════════════════════════════════════════════════════ -->
<div class="app-shell">

  <!-- SYSTEM RAIL ── new chrome from v3 mockups -->
  <aside class="app-rail">
    <div class="rail__brand">
      <div class="rail__brand-mark"><span class="ds-cipher" data-cipher-set="hexa">WSC·1AB7</span></div>
      <div class="rail__brand-name">LUNETH</div>
      <div class="rail__brand-sub">v3.27 · CODEX</div>
    </div>
    <div class="rail__section">
      <div class="rail__section-label">Workspaces</div>
      <button class="rail__item" data-rail-nav="coverage"><span class="rail__icon">◉</span><span class="rail__label">Coverage</span><span class="rail__kbd">⌘1</span></button>
      <button class="rail__item" data-rail-nav="regimen"><span class="rail__icon">▤</span><span class="rail__label">Regimen</span><span class="rail__kbd">⌘2</span></button>
      <button class="rail__item" data-rail-nav="scanner"><span class="rail__icon">⌖</span><span class="rail__label">Scanner</span><span class="rail__kbd">⌘3</span></button>
    </div>
    <div class="rail__divider"></div>
    <div class="rail__section">
      <div class="rail__section-label">Drawers</div>
      <button class="rail__item" data-rail-nav="search"><span class="rail__icon">⌕</span><span class="rail__label">Search</span><span class="rail__kbd">S</span></button>
      <button class="rail__item" data-rail-nav="knowledge"><span class="rail__icon">❡</span><span class="rail__label">Knowledge</span><span class="rail__kbd">K</span></button>
      <button class="rail__item" data-rail-nav="journey"><span class="rail__icon">⌭</span><span class="rail__label">Journey</span><span class="rail__kbd">J</span></button>
    </div>
    <div class="rail__spacer"></div>
    <div class="rail__footer">
      <div class="rail__profile">
        <div class="rail__avatar">L</div>
        <div>
          <div class="rail__profile-name">Luneth</div>
          <div class="rail__profile-meta">SETTINGS · PROFILE</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- TOPBAR -->
  <header class="app-topbar">
    <div class="topbar__breadcrumb">
      <span class="topbar__workspace-tag">WS·01 · <span class="ds-cipher" data-cipher-set="alphanum">COVERAGE</span></span>
      <h1 class="topbar__title">COVERAGE</h1>
      <span class="topbar__sub">// where you are, what you're missing</span>
    </div>
    <button class="topbar__ask topbar__ask--green" data-topbar-ask type="button" aria-label="Ask Wallach — open Search">
      <span class="topbar__ask-dot" aria-hidden="true"></span>
      <span class="topbar__ask-label">Ask Wallach</span>
      <span class="topbar__ask-kbd">S</span>
    </button>
    <div class="topbar__telemetry">
      <span class="telemetry__item"><span class="pulse-dot"></span> SYNCED</span>
      <span class="telemetry__item">CODEX <strong>v3.27</strong></span>
    </div>
  </header>

  <!-- WORKSPACE — hosts the workspace mount slots -->
  <main class="app-workspace">

    <!-- NEW MOUNT SLOTS — empty until views/ modules migrate in Round 2-5 -->
    <div id="workspace-coverage-mount"></div>
    <div id="workspace-regimen-mount"></div>
    <div id="workspace-scanner-mount"></div>

  </main>

  <!-- FOOTER (telemetry) -->
  <footer class="app-footer">
    <span class="footer__item"><span class="dot"></span><strong>READY</strong> · all systems</span>
    <span class="footer__item">EDEN <strong>v1</strong> · sealed <span class="ds-cipher" data-cipher-set="hexa">8E594A01</span></span>
    <span class="footer__item">BUILD <strong>v3</strong> · native</span>
    <span class="footer__spacer"></span>
    <span class="footer__signature">// RENDERED WITH WALLACH·SYS v3.27</span>
  </footer>

  <!-- OVERLAY MOUNT SLOTS — drawers + palette mount here in Round 5 -->
  <div id="drawer-search-mount"></div>
  <!-- Textured-highlighter filter for <mark> (design-system.css filter: url(#ds-filter-rough)); required once per page. -->
  <svg width="0" height="0" aria-hidden="true" style="position: absolute;"><defs><filter id="ds-filter-rough"><feTurbulence type="fractalNoise" baseFrequency=".08" numOctaves="4"/><feDisplacementMap in="SourceGraphic" scale="5" /></filter></defs></svg>
  <div id="drawer-knowledge-mount"></div>
  <div id="drawer-journey-mount"></div>
  <div id="palette-mount"></div>

</div>

<!-- IIFE format (not type="module") so opening dashboard.html via file:// works.
     The build script emits IIFE; hand-bundled fallback is IIFE too. -->
<script src="./assets/js/dist/main.js"></script>

</body>
</html>
