<!DOCTYPE html>
<!--
═══════════════════════════════════════════════════════════════════════════════
  Design Wisdom Reference #020 — HejChristian-highlight-marks
═══════════════════════════════════════════════════════════════════════════════
  Title:         Mark/highlight effect (for emphasis on quotes)
  Source URL:    https://codepen.io/HejChristian/pen/NPbBeqO
  Author:        HejChristian (Christian Alder)
  Captured:      2026-06-20
  Categories:    typography, highlight, emphasis, wallach-popup-relevant, extract-effect-only

  USER NOTES (verbatim):
  ──────────────────────────────────────────────────────────────────────────────
  "some cool mark effects, could for highlighting parts of Wallach quotes that
  are important (could look AMAZING if implemented in a smart way) - almost
  everything else I don't like about this though, the emojis, grid background,
  button style, even the font to a degree. But the mark/highlight effect is
  very good and relevant"

  EXTRACT-ONLY: the <mark> effect itself (highlighter feel via SVG filter +
  pseudo elements + box-shadow). Discard emoji content, grid background,
  button styling, font choice. Pair with #022 quote style for Wallach popup.

  Implementation notes:
  - Uses SVG <feTurbulence> + <feDisplacementMap> for the "jagged paper" feel
  - --color CSS variable controls per-instance highlight color
  - Limitation: doesn't line-wrap cleanly (display: inline-block); fine for
    single-phrase emphasis, not long sentences crossing line breaks
═══════════════════════════════════════════════════════════════════════════════
-->
<html>
<head>
<meta charset="utf-8">
<title>Reference #020 — HejChristian highlight marks</title>
<style>
:root {
  /* Flexoki Color Palette - 400 */
  --color-red: hsl(13, 100%, 87%);
  --color-orange: hsl(27, 98%, 84%);
  --color-yellow: hsl(46, 83%, 80%);
  --color-green: hsl(66, 45%, 79%);
  --color-cyan: hsl(158, 47%, 83%);
  --color-blue: hsl(199, 42%, 84%);
  --color-purple: hsl(274, 27%, 88%);
  --color-magenta: hsl(345, 88%, 90%);
  --texture-noise: none;
  --color-accent: #444;
  --step-1: 1.25rem;
}

body { font-family: Georgia, serif; padding: 2em; max-width: 60ch; margin: 0 auto; }

main { display: flex; flex-direction: column; gap: 0.5em; }
main p { font-size: var(--step-1); max-width: 40ch; width: 100%; }
hr { width: 100%; border-color: var(--color-accent); }

mark {
  --color: var(--color-purple);
  display: inline-block;
  position: relative;
  background-color: unset;
  isolation: isolate;
}

mark::before {
  position: absolute;
  inset: 0;
  content: '';
  width: calc(100% + 1ch);
  left: -.25ch;
  height: 110%;
  top: -5%;
  border-bottom-right-radius: 20px 30px;
  background-color: var(--color);
  background-image: var(--texture-noise);
  opacity: .75;
  box-shadow:
    inset -2px 0px 1px hsl(from var(--color) h s calc(l - 20)),
    inset -4px 0px 5px hsl(from var(--color) h s calc(l - 20));
  filter: url(#filter-rough);
  z-index: -1;
}

mark::after {
  position: absolute;
  content: '';
  height: 1ch;
  width: .5ch;
  top: 2px;
  right: -.25em;
  background: radial-gradient(
    hsl(from var(--color) h s calc(l - 30)),
    hsl(from var(--color) h s l)
  );
  opacity: .4;
  border-radius: 10px 0 50px/200px 0;
  rotate: 15deg;
  filter: url(#filter-rough);
  z-index: -1;
}
</style>
</head>
<body>
<svg width="0" height="0" aria-hidden="true" style="position: absolute;">
  <defs>
    <filter id="filter-rough">
      <feTurbulence type="fractalNoise" baseFrequency=".08" numOctaves="4"/>
      <feDisplacementMap in="SourceGraphic" scale="5" />
    </filter>
  </defs>
</svg>

<main>
  <p>The <mark>&lt;mark&gt;</mark> element in HTML is pretty cool as it is for highlighting stuff.</p>
  <p>But it could be made <mark>even cooler</mark>.</p>
  <p>Here's one in <mark style="--color: var(--color-green)">green</mark></p>
  <p>Any colour can be applied easily by updating the <mark style="--color: var(--color-green)">--color</mark> CSS variable.</p>
  <p>A <mark style="--color: var(--color-red)">few</mark> more <mark style="--color: var(--color-blue)">colours</mark> just for <mark style="--color: var(--color-orange)">good</mark> measure. <mark style="--color: var(--color-magenta)">Nice</mark></p>
</main>
</body>
</html>
