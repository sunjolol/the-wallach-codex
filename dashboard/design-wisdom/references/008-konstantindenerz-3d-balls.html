<title>Reference #008 — konstantindenerz 3D Glass Switch</title>
<!-- CSS is CSS-SCSS — not vanilla; preserve as authored -->
<style data-format="css-scss">
/* CSS-SCSS source — not browser-renderable as-is.
   The @property declarations work natively in Chromium; the rest is SCSS nesting. */

@property --ratio {
  syntax: "<number>";
  inherits: true;
  initial-value: 1;
}
@property --color {
  syntax: "<color>";
  inherits: true;
  initial-value: white;
}
@property --glowposition {
  syntax: "<percent>";
  inherits: true;
  initial-value: 0%;
}

:root {
  --light: #f7fbfc;
  --dark: #bcc7d3;
  --duration: 0.25s;
  --press-duration: 0.25s;
  --press-timing-function: ease-in-out;
  --timing-function: ease-in-out;
}

.surface { position: absolute; inset: 0; border-radius: inherit; }

.bg {
  background: white;
  position: absolute;
  inset: 0vmin;
  box-shadow: 10px 10px 25px 10px var(--dark), -10px -10px 25px 10px var(--light);
  border-radius: inherit;
  filter: blur(0.8vmin);

  &:before {
    content: "";
    position: absolute;
    bottom: -1px; right: 1vmin; top: 3vmin; left: 2vmin;
    border-radius: inherit;
    box-shadow: 4px 4px 7px rgba(0, 0, 0, 0.6);
    z-index: -1;
  }
  &:after {
    content: "";
    position: absolute;
    inset: 1.2vmin;
    background: white;
    border-radius: inherit;
  }
}

.outer-shadow {
  position: absolute; inset: 0; border-radius: inherit;
  &:before {
    content: ""; position: absolute; border-radius: inherit;
    left: -1vmin; top: 1vmin; bottom: 1vmin; right: 0;
    border-left: 1vmin solid rgba(0, 0, 0, 0.05);
    filter: blur(0.3vmin);
  }
  &:after {
    content: ""; position: absolute; border-radius: inherit;
    left: 0vmin; top: 1vmin; bottom: 1vmin; right: 0.5vmin;
    border-top: 0.5vmin solid hsla(0, 0%, 0%, 0.5);
    border-bottom: 3vmin solid var(--light);
    filter: blur(0.3vmin);
  }
}

.inner-shadow {
  position: absolute; border-radius: inherit;
  --max: 0.98; --ratio: 1;
  inset: calc(2.5vmin * var(--ratio));
  box-shadow:
    0 0 1vmin calc(0.2vmin * var(--ratio)) rgba(0, 0, 0, 0.2),
    0 0 1.5vmin calc(0.1vmin * var(--ratio)) rgba(0, 0, 0, 0.2),
    0 0 1.8vmin calc(0.3vmin * var(--ratio)) rgba(0, 0, 0, 0.2),
    0vmin 0vmin calc(1.5vmin * var(--ratio)) calc(1.5vmin * var(--ratio)) hsl(210deg 18.5% 37% / 43.92%),
    0 0 1.5vmin 2vmin rgba(255, 255, 255, 0.8);
}

.active-light {
  position: absolute; border-radius: inherit;
  inset: 1.5vmin;
  background:
    radial-gradient(50% 100% at 50% 50%, #ff5500, #692a0b, transparent 90%),
    radial-gradient(20% 100% at 100% 50%, var(--color, var(--dark)) 70%, transparent 90%),
    radial-gradient(20% 100% at 0% 50%, var(--color, var(--dark)) 70%, transparent 90%) no-repeat;
  filter: blur(2vmin) brightness(100%);
  background-size: 200%;
  mix-blend-mode: darken;
  opacity: 0.9;
}

.inner-surface {
  overflow: hidden;
  position: absolute; border-radius: inherit;
  --max: 1.2; --ratio: 1;
  inset: calc(2vmin * var(--ratio));
  background:
    linear-gradient(to bottom, hsla(0, 0%, 90%, 0.8), transparent),
    radial-gradient(32% 49% at 60% 50%, #b43f01, transparent),
    radial-gradient(32% 49% at 50% 70%, #1e2f42, transparent),
    radial-gradient(82% 49% at 50% 50%, #1e2f42, transparent),
    transparent;
}

.balls { position: absolute; inset: 0; }

.inactive-ball {
  background:
    radial-gradient(30% 30% at 60% 40%, white, transparent 60%),
    radial-gradient(40% 40% at 10% 65%, white, transparent),
    radial-gradient(70% 70% at 30% 30%, white, transparent),
    radial-gradient(60% 60% at 30% 30%, white 30%, #39414a),
    hsla(0, 0%, 100%, 1);
  position: absolute;
  width: 14vmin; top: 1vmin; left: 1.5vmin;
  aspect-ratio: 1; border-radius: 50%;
}

.active-ball {
  background:
    radial-gradient(25% 25% at 65% 65%, rgba(255, 0, 0, 0.6), transparent),
    radial-gradient(20% 20% at 70% 30%, hsla(0, 0%, 100%, 0.4), transparent),
    radial-gradient(60% 60% at 70% 30%, #ffb400, transparent),
    radial-gradient(60% 60% at 20% 10%, #ffbf4a, transparent),
    radial-gradient(60% 60% at 20% 50%, #ffbf4a, transparent),
    radial-gradient(60% 60% at 70% 30%, #ff5b0e, transparent),
    #c30c0c;
  position: absolute;
  width: 14vmin; top: 1vmin; right: 1.5vmin;
  aspect-ratio: 1; border-radius: 50%;
}

.glass {
  position: absolute; inset: 0vmin;
  background: hsla(0, 0%, 100%, 0.1);
  backdrop-filter: blur(1.5vmin);
  border-radius: inherit;
  z-index: 111;
}

input { display: none; }

.switch {
  cursor: pointer;
  width: 36vmin; height: 20vmin;
  border-radius: 40vmin;
  position: relative;
  perspective: 50vmin;
}

body {
  width: 100vw; height: 100vh;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, #f7fbfc, #bcc7d3);
}

* { box-sizing: border-box; }

/* NOTE: Full SCSS source with nested rules, keyframes (ratio, ratio-reverse,
   active-light, active-light-reverse, inactive-ball, active-ball, ball-light
   variants), and animation choreography in the original CodePen.
   Preserved here is enough to convey the structure + the load-bearing
   visual choices. For full animation timing, see source URL or recover
   from the cached CodePen response. */
</style>
</head>
<body>
<label id="switch" class="switch">
  <input type="checkbox">
  <div class="surface">
    <div class="bg"></div>
    <div class="outer-shadow"></div>
    <div class="inner-shadow"></div>
    <div class="active-light"></div>
    <div class="inner-surface">
      <div class="balls">
        <div class="active-ball"></div>
        <div class="inactive-ball"></div>
      </div>
      <div class="glass"></div>
      <div class="dark-shadow"></div>
      <div class="light-shadow"></div>
    </div>
    <div class="lights">
      <div class="active-ball-light"></div>
      <div class="inactive-ball-light"></div>
    </div>
  </div>
</label>
<!-- No JS — author's JS panel is literally "// ¯\_(ツ)_/¯" — pure CSS effect -->
