<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duplicate Review — The Wallach Codex</title>
<style>
  :root{
    --bg:#f5f1e8; --panel:#fffdf8; --ink:#2b2723; --muted:#7a7267; --line:#e3dccc;
    --accent:#8a6d3b; --keep:#2e7d52; --merge:#2f6f9f; --notdup:#8a8178; --danger:#a8442f;
    --chip:#efe8d8; --amber:#f4e7c4; --amberln:#d8b44a; --shadow:0 1px 3px rgba(60,50,30,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:15px/1.5 "Iowan Old Style","Palatino Linotype",Georgia,serif;}
  code,.mono{font-family:"SFMono-Regular",Menlo,Consolas,monospace}
  .wrap{max-width:1180px;margin:0 auto;padding:14px 18px 80px}
  /* top bar */
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0 8px;margin-bottom:14px}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  h1{font-size:18px;margin:0;letter-spacing:.2px;font-weight:600}
  h1 small{color:var(--muted);font-size:12px;font-weight:400;letter-spacing:.5px;text-transform:uppercase;margin-left:8px}
  .spacer{flex:1}
  button,select,input[type=number]{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:6px 10px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  label.ctl{font-size:12px;color:var(--muted);display:flex;gap:5px;align-items:center}
  /* progress */
  .prog{height:7px;background:var(--chip);border-radius:6px;overflow:hidden;margin-top:9px}
  .prog>i{display:block;height:100%;background:var(--keep);width:0}
  .tallies{font-size:12px;color:var(--muted);margin-top:6px}
  .tallies b{color:var(--ink)}
  .tallies .k{color:var(--keep)} .tallies .m{color:var(--merge)} .tallies .n{color:var(--notdup)}
  /* pair header */
  .pairhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .idx{font-size:13px;color:var(--muted)}
  .score{font-weight:700;font-size:13px;padding:3px 9px;border-radius:20px;background:var(--chip)}
  .score.hi{background:#e7d6a8}
  .chip{font-size:11px;background:var(--chip);border:1px solid var(--line);border-radius:20px;padding:2px 9px;color:#5a5348}
  .sig{font-size:11px;background:#e9eef2;border:1px solid #cdd9e2;border-radius:20px;padding:2px 9px;color:#37566b;font-family:var(--mono)}
  .prior{background:var(--amber);border:1px solid var(--amberln);border-radius:8px;padding:7px 11px;font-size:13px;margin-bottom:12px}
  .ruled-badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px}
  .ruled-badge.keep_a,.ruled-badge.keep_b{background:#d9ecdf;color:var(--keep)}
  .ruled-badge.merge{background:#d9e6f1;color:var(--merge)}
  .ruled-badge.not_dup{background:#e7e2da;color:var(--notdup)}
  /* claim columns */
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:820px){.cols{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 15px;box-shadow:var(--shadow)}
  .card.side-a{border-top:3px solid #9c7bb0}
  .card.side-b{border-top:3px solid #6f9f8a}
  .card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
  .kindbadge{font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;color:var(--accent)}
  .cid{font-size:11px;color:var(--muted);font-family:var(--mono)}
  .loc{font-size:12px;color:var(--muted);margin-bottom:8px}
  .q{font-size:15px;font-weight:600;margin:6px 0 8px}
  .ctext{font-size:14px;margin:0 0 10px}
  .vlabel{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:3px}
  .verbatim{white-space:pre-wrap;background:#faf6ec;border-left:3px solid var(--accent);padding:8px 11px;border-radius:0 6px 6px 0;font-size:13.5px;color:#3a342c}
  .tags{margin-top:10px;display:flex;gap:5px;flex-wrap:wrap}
  .tag{font-size:11px;border-radius:5px;padding:1px 7px;background:var(--chip);color:#5a5348}
  .tag.ess{background:#dbe6f0;color:#2f5b7a} .tag.cond{background:#f0e2dc;color:#8a4a34}
  .ans{font-size:12px;color:var(--muted);margin-top:9px;font-style:italic}
  /* ruling bar */
  .rulebar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:11px 0 6px;margin-top:16px}
  .rulebtns{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .rb{padding:9px 15px;font-size:14px;font-weight:600;border-radius:9px}
  .rb.keep{color:var(--keep)} .rb.merge{color:var(--merge)} .rb.notdup{color:var(--notdup)}
  .rb.active{color:#fff}
  .rb.keep.active{background:var(--keep);border-color:var(--keep)}
  .rb.merge.active{background:var(--merge);border-color:var(--merge)}
  .rb.notdup.active{background:var(--notdup);border-color:var(--notdup)}
  .merge-opts{display:none;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-left:6px}
  .merge-opts.show{display:flex}
  .note{width:100%;margin-top:9px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;background:var(--panel);resize:vertical;min-height:34px}
  .nav{display:flex;gap:8px;align-items:center;margin-top:9px;font-size:12px;color:var(--muted)}
  kbd{font-family:var(--mono);font-size:11px;background:var(--chip);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .hidefile{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="row">
      <h1>Duplicate Review <small>The Wallach Codex</small></h1>
      <div class="spacer"></div>
      <label class="ctl">Signal
        <select id="fSignal"><option value="">all</option></select>
      </label>
      <label class="ctl">Min score
        <input id="fScore" type="number" min="0" max="1" step="0.05" value="0" style="width:64px">
      </label>
      <label class="ctl"><input id="fHide" type="checkbox"> hide ruled</label>
      <label class="ctl">Sort
        <select id="fSort"><option value="score">score ↓</option><option value="signal">signal</option></select>
      </label>
      <button id="btnLoad">Load candidates…</button>
      <input id="file" class="hidefile" type="file" accept=".json,.js">
      <button id="btnExport" class="btn-primary">Export decisions</button>
    </div>
    <div class="prog"><i id="progbar"></i></div>
    <div class="tallies" id="tallies"></div>
  </header>

  <main id="main"></main>
</div>

<div class="wrap" style="padding-top:0">
  <div class="rulebar" id="rulebar" style="display:none">
    <div class="rulebtns">
      <button class="rb keep" data-r="keep_a" title="keep claim A, remove B">Keep A <kbd>a</kbd></button>
      <button class="rb keep" data-r="keep_b" title="keep claim B, remove A">Keep B <kbd>b</kbd></button>
      <button class="rb merge" data-r="merge" title="merge into one richer claim">Merge <kbd>m</kbd></button>
      <button class="rb notdup" data-r="not_dup" title="not a duplicate — dismiss">Not a duplicate <kbd>n</kbd></button>
      <span class="merge-opts" id="mergeOpts">primary:
        <label><input type="radio" name="primary" value="a"> A</label>
        <label><input type="radio" name="primary" value="b"> B</label>
        <span style="font-style:italic">— I author the merge for your approval</span>
      </span>
    </div>
    <textarea class="note" id="note" placeholder="optional note (why, or merge guidance)…"></textarea>
    <div class="nav">
      <button id="prev">◀ Prev</button>
      <button id="next">Next ▶</button>
      <button id="nextUnruled">Next unruled <kbd>u</kbd></button>
      <span class="spacer"></span>
      <span>Keys: <kbd>a</kbd> <kbd>b</kbd> <kbd>m</kbd> <kbd>n</kbd> rule · <kbd>←</kbd> <kbd>→</kbd> move · <kbd>u</kbd> next unruled</span>
    </div>
  </div>
</div>

<script src="review-data.js"></script>
<script>
(function(){
  "use strict";
  var KEY = "wallach-dedup-decisions-v1";
  var MODEL = window.__CANDIDATES__ || null;
  var allPairs = (MODEL && MODEL.pairs) ? MODEL.pairs.slice() : [];
  var decisions = loadDecisions();
  var view = [];
  var cur = 0;

  var $ = function(s){ return document.querySelector(s); };
  function loadDecisions(){ try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e){ return {}; } }
  function persist(){ localStorage.setItem(KEY, JSON.stringify(decisions)); }
  function esc(s){ return (s==null?"":String(s)).replace(/[&<>]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }

  // populate signal filter
  (function(){
    var counts = {};
    allPairs.forEach(function(p){ (p.signals||[]).forEach(function(s){ counts[s]=(counts[s]||0)+1; }); });
    var sel = $("#fSignal");
    Object.keys(counts).sort().forEach(function(s){
      var o = document.createElement("option"); o.value=s; o.textContent=s+" ("+counts[s]+")"; sel.appendChild(o);
    });
  })();

  function recompute(){
    var sig = $("#fSignal").value, minS = parseFloat($("#fScore").value)||0, hide = $("#fHide").checked;
    var sort = $("#fSort").value;
    view = allPairs.filter(function(p){
      if (sig && (p.signals||[]).indexOf(sig)<0) return false;
      if ((p.score||0) < minS) return false;
      if (hide && decisions[p.pair_id]) return false;
      return true;
    });
    if (sort==="score") view.sort(function(a,b){ return (b.score-a.score) || a.pair_id.localeCompare(b.pair_id); });
    else view.sort(function(a,b){ return (a.signals[0]||"").localeCompare(b.signals[0]||"") || (b.score-a.score); });
    if (cur >= view.length) cur = Math.max(0, view.length-1);
    updateProgress(); render();
  }

  function updateProgress(){
    var ruled = Object.keys(decisions).length, total = allPairs.length;
    var t = {keep_a:0,keep_b:0,merge:0,not_dup:0};
    Object.keys(decisions).forEach(function(k){ var r=decisions[k].ruling; if(t[r]!=null)t[r]++; });
    $("#progbar").style.width = total? (100*ruled/total)+"%" : "0";
    $("#tallies").innerHTML =
      "<b>"+ruled+"</b> / "+total+" ruled &nbsp;·&nbsp; "+
      "<span class='k'>keep "+(t.keep_a+t.keep_b)+"</span> &nbsp; "+
      "<span class='m'>merge "+t.merge+"</span> &nbsp; "+
      "<span class='n'>not-dup "+t.not_dup+"</span> &nbsp;·&nbsp; showing "+view.length;
  }

  function claimCard(c, side){
    var tags = "";
    (c.essentials||[]).forEach(function(x){ tags += "<span class='tag ess'>"+esc(x)+"</span>"; });
    (c.conditions||[]).forEach(function(x){ tags += "<span class='tag cond'>"+esc(x)+"</span>"; });
    (c.other_substances||[]).forEach(function(x){ tags += "<span class='tag'>"+esc(x)+"</span>"; });
    (c.symptoms||[]).forEach(function(x){ tags += "<span class='tag'>"+esc(x)+"</span>"; });
    return "<div class='card side-"+side+"'>"+
      "<div class='top'><span class='kindbadge'>"+side.toUpperCase()+" · "+esc(c.kind)+"</span><span class='cid'>"+esc(c.id)+"</span></div>"+
      "<div class='loc'>"+esc(c.book)+(c.page?(" · p."+esc(c.page)):"")+" &nbsp;·&nbsp; subject <b>"+esc(c.subject)+"</b> · facet "+esc(c.facet)+"</div>"+
      (c.question?("<div class='q'>"+esc(c.question)+"</div>"):"")+
      "<div class='ctext'>"+esc(c.claim_text)+"</div>"+
      "<div class='vlabel'>verbatim</div><div class='verbatim'>"+esc(c.verbatim)+"</div>"+
      (tags?("<div class='tags'>"+tags+"</div>"):"")+
      (c.answer_short?("<div class='ans'>search answer: "+esc(c.answer_short)+"</div>"):"")+
      "</div>";
  }

  function render(){
    var main = $("#main"), bar = $("#rulebar");
    if (!allPairs.length){ main.innerHTML = "<div class='empty'>No candidate data loaded.<br>Use <b>Load candidates…</b> to open a candidates.json file.</div>"; bar.style.display="none"; return; }
    if (!view.length){ main.innerHTML = "<div class='empty'>No pairs match the current filter.</div>"; bar.style.display="none"; return; }
    bar.style.display = "block";
    var p = view[cur];
    var d = decisions[p.pair_id] || null;
    var hi = (p.score>=0.75)?" hi":"";
    var sigChips = (p.signals||[]).map(function(s){ return "<span class='sig' title='"+esc((p.signal_detail||{})[s]||"")+"'>"+esc(s)+"</span>"; }).join(" ");
    var ruledBadge = d ? "<span class='ruled-badge "+d.ruling+"'>ruled: "+d.ruling.replace("_"," ")+"</span>" : "";
    var head = "<div class='pairhead'>"+
        "<span class='idx'>Pair "+(cur+1)+" of "+view.length+"</span>"+
        "<span class='score"+hi+"'>score "+p.score+"</span>"+ sigChips + ruledBadge +
      "</div>"+
      (p.prior_ruling?("<div class='prior'>⚑ "+esc(p.prior_ruling)+"</div>"):"");
    main.innerHTML = head + "<div class='cols'>"+claimCard(p.a,"a")+claimCard(p.b,"b")+"</div>";

    // reflect ruling state on buttons
    document.querySelectorAll(".rb").forEach(function(b){ b.classList.toggle("active", !!d && d.ruling===b.dataset.r); });
    var mo = $("#mergeOpts"); mo.classList.toggle("show", !!d && d.ruling==="merge");
    document.querySelectorAll("input[name=primary]").forEach(function(r){ r.checked = !!d && d.primary===r.value; });
    $("#note").value = (d && d.note) || "";
  }

  function setRuling(r){
    var p = view[cur]; if(!p) return;
    var d = decisions[p.pair_id] || {};
    d.ruling = r; d.ts = Date.now();
    d.a_id = p.a.id; d.b_id = p.b.id; d.signals = p.signals; d.score = p.score;
    if (r !== "merge") delete d.primary;
    decisions[p.pair_id] = d; persist(); updateProgress(); render();
  }

  // events
  document.querySelectorAll(".rb").forEach(function(b){ b.addEventListener("click", function(){ setRuling(b.dataset.r); }); });
  document.querySelectorAll("input[name=primary]").forEach(function(r){
    r.addEventListener("change", function(){ var p=view[cur]; if(p&&decisions[p.pair_id]){ decisions[p.pair_id].primary=r.value; persist(); } });
  });
  $("#note").addEventListener("input", function(){
    var p=view[cur]; if(!p) return; var d=decisions[p.pair_id]||{a_id:p.a.id,b_id:p.b.id,signals:p.signals,score:p.score};
    d.note=this.value; if(!d.ruling){ /* keep note even before ruling */ } decisions[p.pair_id]=d; persist(); updateProgress();
  });
  function go(delta){ cur = Math.min(view.length-1, Math.max(0, cur+delta)); render(); }
  function nextUnruled(){ for(var i=cur+1;i<view.length;i++){ if(!decisions[view[i].pair_id]){ cur=i; render(); return; } } for(var j=0;j<view.length;j++){ if(!decisions[view[j].pair_id]){ cur=j; render(); return; } } }
  $("#prev").onclick=function(){go(-1);}; $("#next").onclick=function(){go(1);}; $("#nextUnruled").onclick=nextUnruled;
  ["fSignal","fScore","fHide","fSort"].forEach(function(id){ $("#"+id).addEventListener("change", function(){ cur=0; recompute(); }); });

  document.addEventListener("keydown", function(e){
    if (e.target && (e.target.tagName==="TEXTAREA" || e.target.tagName==="INPUT" || e.target.tagName==="SELECT")) return;
    var k = e.key.toLowerCase();
    if (k==="a") setRuling("keep_a"); else if (k==="b") setRuling("keep_b");
    else if (k==="m") setRuling("merge"); else if (k==="n") setRuling("not_dup");
    else if (e.key==="ArrowLeft") go(-1); else if (e.key==="ArrowRight") go(1);
    else if (k==="u") nextUnruled(); else return;
    e.preventDefault();
  });

  // export
  $("#btnExport").onclick = function(){
    var out = { tool:"wallach-duplicate-review", exported_at:new Date().toISOString(),
      total_candidates: allPairs.length, total_ruled: Object.keys(decisions).length,
      decisions: Object.keys(decisions).map(function(pid){ var d=decisions[pid]; return {
        pair_id:pid, a_id:d.a_id, b_id:d.b_id, ruling:d.ruling||null, primary:d.primary||null,
        note:d.note||"", signals:d.signals||[], score:d.score }; })
        .filter(function(x){ return x.ruling || x.note; }) };
    var blob = new Blob([JSON.stringify(out,null,1)], {type:"application/json"});
    var a = document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="dedup-decisions.json";
    document.body.appendChild(a); a.click(); a.remove();
  };

  // load a candidates file at runtime
  $("#btnLoad").onclick=function(){ $("#file").click(); };
  $("#file").onchange=function(e){
    var f=e.target.files[0]; if(!f) return; var rd=new FileReader();
    rd.onload=function(){ try{
      var txt=rd.result; var data;
      var m = txt.match(/__CANDIDATES__\s*=\s*([\s\S]*);\s*$/);   // accept review-data.js too
      data = JSON.parse(m ? m[1] : txt);
      allPairs = (data.pairs||[]).slice(); cur=0;
      // repopulate signal filter
      var sel=$("#fSignal"); sel.innerHTML="<option value=''>all</option>";
      var counts={}; allPairs.forEach(function(p){ (p.signals||[]).forEach(function(s){ counts[s]=(counts[s]||0)+1; }); });
      Object.keys(counts).sort().forEach(function(s){ var o=document.createElement("option"); o.value=s; o.textContent=s+" ("+counts[s]+")"; sel.appendChild(o); });
      recompute();
    }catch(err){ alert("Could not parse: "+err.message); } };
    rd.readAsText(f);
  };

  recompute();
})();
</script>
</body>
</html>
