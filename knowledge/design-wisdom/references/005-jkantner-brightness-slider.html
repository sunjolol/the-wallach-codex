<!DOCTYPE html>
<!--
═══════════════════════════════════════════════════════════════════════════════
  Design Wisdom Reference #005 — jkantner-brightness-slider
═══════════════════════════════════════════════════════════════════════════════
  Title:         Vertical brightness slider — color + UI follow the slider
  Source URL:    https://codepen.io/jkantner/pen/mdEPpxq
  Author:        jkantner (CodePen)
  Captured:      2026-06-20
  Categories:    effects, novel, adaptable, slider, hue-shift, ui-component

  USER NOTES (verbatim):
  ──────────────────────────────────────────────────────────────────────────────
  "an effect you've never seen, could be creatively adapted for different
  purposes in all kinds of ways I'm sure"

  Observed: vertical range slider where dragging changes BOTH (a) the body's
  background lightness AND (b) the thumb's hue (red→green as percentage rises).
  Two-axis coupling makes the slider feel like a real physical control.
  CSS custom properties (--l1, --l2, --l3, --p, --pT) drive everything from JS.
  Easy to adapt: same pattern works for volume, opacity, intensity, "wallach
  alignment score" anywhere a single value drives both shade + color cue.
═══════════════════════════════════════════════════════════════════════════════
-->
<html>
<head>
<meta charset="utf-8">
<title>Reference #005 — jkantner brightness slider</title>
<style>
* { border: 0; box-sizing: border-box; margin: 0; padding: 0; }
:root { font-size: calc(48px + 24 * (100vw - 320px) / (1280 - 320)); }
body, form { display: flex; }
body, input { font: 1em/1.5 sans-serif; }
body {
  --l1: hsl(228,9.8%,100%);
  --l2: hsl(228,9.8%,90%);
  --l3: hsl(228,9.8%,63%);
  --p: hsl(120,90.4%,44.9%);
  --pT: hsla(120,90.4%,44.9%,0);
  background-color: var(--l2);
  height: 100vh;
}
form, input[type=range] { margin: auto; }
form { height: 6em; }
input[type=range], label { -webkit-tap-highlight-color: transparent; }
input[type=range] {
  background-color: transparent;
  border-radius: 0.75em;
  box-shadow: -0.1em -0.1em 0.1em var(--l3) inset, 0.1em 0.1em 0.1em var(--l1) inset;
  cursor: pointer;
  transform: rotate(-90deg);
  height: 1.5em; width: 6em;
  appearance: none;
}
input[type=range]:focus { outline: transparent; }
input[type=range]::-webkit-slider-thumb,
input[type=range]::-moz-range-thumb {
  border: 0;
  background:
    linear-gradient(var(--p), var(--p)) 70% 50%/20% 5% no-repeat,
    linear-gradient(var(--l2), var(--l2)) 70% 50%/20% 15% no-repeat,
    radial-gradient(100% 100% at 50% 50%, var(--pT) 14%, var(--p) 15% 19%, var(--pT) 20%),
    var(--l2);
  border-radius: 50%;
  box-shadow: -0.25em 0 0.5em var(--l3), 0.25em 0 0.5em var(--l1);
  width: 1.5em; height: 1.5em;
  appearance: none;
}
label { clip: rect(1px, 1px, 1px, 1px); overflow: hidden; position: absolute; width: 1px; height: 1px; }
</style>
</head>
<body>
<form>
  <label for="brightness">Brightness</label>
  <input type="range" id="brightness" name="brightness" min="1" max="100" value="100">
</form>
<script>
document.addEventListener("DOMContentLoaded", function() {
  const slider = document.getElementById("brightness");
  slider.addEventListener("input", adjustSlider);
  adjustSlider(slider);
});
function adjustSlider(e) {
  const body = document.body,
    switchLightMin = 40, switchLightMax = 100,
    tar = e.target || e,
    pct = +tar.value / +tar.max,
    L1 = pct * (switchLightMax - switchLightMin) + switchLightMin,
    L2 = L1 - 10, L3 = L1 - 37, L = [L1, L2, L3],
    thumbHue = pct * 120,
    thumbHSL = `${thumbHue},90.4%,44.9%`;
  L.forEach((light, i) => {
    if (light < 0) light = 0;
    body.style.setProperty(`--l${i + 1}`, `hsl(228,9.8%,${light}%)`);
  });
  body.style.setProperty(`--p`, `hsl(${thumbHSL})`);
  body.style.setProperty(`--pT`, `hsla(${thumbHSL},0)`);
}
</script>
</body>
</html>
