html {

.player {

  flex-direction: column;
  align-items: center;
  justify-content: space-around;
}

.song-heading {

    font-size: 2rem;

    color: #5881F3;

  }
  .album-name {
    text-align: center;
    font-size: 1.5rem;
    margin-top: 1rem;
    font-weight: 600;
    color: #858b90;
  }
}

.music-controls {
  display: flex;
  width: 95%;
  justify-content: space-evenly;
  align-items: center;
  .repeat {
    cursor: pointer;
    width: 3rem;
    height: 3rem;
    svg {
      transform: rotate(45deg);
    }
    path {
      fill: #5C87FE;
    }
  }
  .previous, .next {
    cursor: pointer;
    width: 6rem;
    height: 6rem;
    box-shadow: 5px 5px 10px #cee3f2, -5px -5px 10px #faffff;
    padding: 1rem;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    &.pressed {
      box-shadow: inset 5px 5px 10px #cee3f2, inset -5px -5px 10px #faffff;
    }
    svg {
      width: 2rem;
      height: 2rem;
      path {
        fill: #5C87FE;
      }
      rect {
        fill: #5C87FE;
      }
    }
  }
  .play {
    cursor: pointer;
    background-color: #5C87FE;
    padding: 2rem;
    border-radius: 50%;
    display: flex;
    align-items: center;
    box-shadow: 6px 5px 9px 0px #a5c6ec;
    svg {
      width: 4rem;
      height: 4rem;
      path {
        fill: #fff;
      }
    }
    &.pressed {
      box-shadow: none;
    }
  }
  .favorite {
    cursor: pointer;
    &.pressed {
      svg path {
        fill: #e74c3c
      }
    }
  }
}

.audio-control {
  width: 85%;
    height: 6px;
    border-radius: 2px;
    background: #E5F3FE;
    box-shadow: 5px 5px 7px 0px #c7dcec, -7px -7px 8px #f2ffff;
    margin: 4px auto;
    cursor: pointer;
  margin-top: 20px;
  .audio-progress {
    width: 20%;
    height: 100%;
    border-radius: 2px;
    position: relative;
    background-color: #5C87FE;
    &:after {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        border: 3px solid #5C87FE;
        background-color: #fff;
        position: absolute;
        top: -4px;
        right: -5px;
      }
  }
}

}

.hide {

<script>
const prev = document.querySelector('.previous');
const next = document.querySelector('.next');
const fav = document.querySelector('.favorite');
const audio = document.querySelector('#song');
const play = document.querySelector('.play');
const progressBar = document.querySelector('.audio-progress');
const start = document.querySelector('.start');
const end = document.querySelector('.end');

const mp3 = "https://www.mboxdrive.com/Ariana%20Grande%20-%20No%20Tears%20Left%20To%20Cry.mp3"

audio.src = mp3;

const audio2 = "https://voca.ro/asosRyFyiRh";

const togglePressed = (e) => {
  e.srcElement.closest('div').classList.toggle('pressed')
}

window.addEventListener('click', togglePressed, false);
window.addEventListener('mousedown', togglePressed, false);
window.addEventListener('mouseup', togglePressed, false);
window.addEventListener('touchdown', togglePressed, false);
window.addEventListener('touchup', togglePressed, false);

play.addEventListener('click', e => {
  if (audio.paused) {
    play.querySelector('.pause-btn').classList.toggle('hide')
    play.querySelector('.play-btn').classList.toggle('hide')
    audio.play();
  } else {
    play.querySelector('.pause-btn').classList.toggle('hide')
    play.querySelector('.play-btn').classList.toggle('hide')
    audio.pause();
  }
})

audio.addEventListener('timeupdate', e => {
  const percent = (audio.currentTime / audio.duration) * 100;
  let s = parseInt(audio.currentTime % 60);
   let m = parseInt((audio.currentTime / 60) % 60);
  if (s / 10 < 1) s = '0'+ s;
  if (m / 10 < 1) m = '0'+ m;
  let es = parseInt(audio.duration % 60);
  let em = parseInt((audio.duration / 60) % 60);
  if (es / 10 < 1) es = '0'+ es;
  if (em / 10 < 1) em = '0'+ em;
  progressBar.style.width = `${percent}%`;
  start.innerHTML = m + ":" + s;
  if(em) {
    end.innerHTML = em + ":" + es;
  } 
})
</script>
